<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Council Incident Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f4f6f8;
      color: #333;
    }

    header {
      background: #1f4e79;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      width: 90%;
      max-width: 1200px;
      margin: 20px auto;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      text-align: center;
    }

    .card h3 {
      margin: 0 0 10px;
      font-size: 18px;
      color: #1f4e79;
    }

    .card p {
      font-size: 28px;
      font-weight: bold;
      margin: 0;
    }

    .section {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      margin-bottom: 30px;
    }

    .section h2 {
      margin-top: 0;
      color: #1f4e79;
    }

    canvas {
      max-width: 100%;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    table th, table td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
      font-size: 14px;
    }

    table th {
      background: #1f4e79;
      color: white;
    }

    .timestamp {
      margin-top: 10px;
      font-size: 14px;
      color: #666;
    }

    .error {
      color: red;
      font-weight: bold;
      padding: 20px;
      background: white;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Council Incident Dashboard</h1>
    <p>Public overview of incident activity</p>
  </header>

  <div class="container">
    <div id="errorMessage" class="error" style="display:none;"></div>

    <div class="cards">
      <div class="card">
        <h3>Total Incidents</h3>
        <p id="totalIncidents">0</p>
      </div>
      <div class="card">
        <h3>Open Incidents</h3>
        <p id="openIncidents">0</p>
      </div>
      <div class="card">
        <h3>Resolved Incidents</h3>
        <p id="resolvedIncidents">0</p>
      </div>
      <div class="card">
        <h3>In Progress</h3>
        <p id="inProgressIncidents">0</p>
      </div>
    </div>

    <div class="section">
      <h2>Incident Metrics</h2>
      <canvas id="incidentChart"></canvas>
      <p class="timestamp" id="lastUpdated"></p>
    </div>

    <div class="section">
      <h2>Recent Records</h2>
      <table>
        <thead>
          <tr>
            <th>Incident ID</th>
            <th>Reported Date</th>
            <th>Suburb</th>
            <th>Category</th>
            <th>Status</th>
            <th>Priority</th>
          </tr>
        </thead>
        <tbody id="recentRecordsTable"></tbody>
      </table>
    </div>
  </div>

  <script>
    async function loadDashboard() {
      try {
        const response = await fetch('./data/summary.json');

        if (!response.ok) {
          throw new Error('Could not load summary.json');
        }

        const data = await response.json();

        document.getElementById('totalIncidents').textContent = data.metrics.totalIncidents || 0;
        document.getElementById('openIncidents').textContent = data.metrics.openIncidents || 0;
        document.getElementById('resolvedIncidents').textContent = data.metrics.resolvedIncidents || 0;
        document.getElementById('inProgressIncidents').textContent = data.metrics.inProgressIncidents || 0;

        document.getElementById('lastUpdated').textContent =
          'Last updated: ' + (data.lastUpdated || 'N/A');

        const tableBody = document.getElementById('recentRecordsTable');
        tableBody.innerHTML = '';

        if (Array.isArray(data.recentRecords)) {
          data.recentRecords.forEach(record => {
            const row = `
              <tr>
                <td>${record.incident_id || ''}</td>
                <td>${record.reported_date || ''}</td>
                <td>${record.suburb || ''}</td>
                <td>${record.category || ''}</td>
                <td>${record.status || ''}</td>
                <td>${record.priority || ''}</td>
              </tr>
            `;
            tableBody.innerHTML += row;
          });
        }

        const chartLabels = ['Open', 'Resolved', 'In Progress'];
        const chartValues = [
          data.metrics.openIncidents || 0,
          data.metrics.resolvedIncidents || 0,
          data.metrics.inProgressIncidents || 0
        ];

        new Chart(document.getElementById('incidentChart'), {
          type: 'bar',
          data: {
            labels: chartLabels,
            datasets: [{
              label: 'Number of Incidents',
              data: chartValues
            }]
          },
          options: {
            responsive: true,
            plugins: {
              legend: {
                display: true
              }
            },
            scales: {
              y: {
                beginAtZero: true
              }
            }
          }
        });

      } catch (error) {
        document.getElementById('errorMessage').style.display = 'block';
        document.getElementById('errorMessage').textContent =
          'Error loading dashboard: ' + error.message;
      }
    }

    loadDashboard();
  </script>
</body>
</html>
